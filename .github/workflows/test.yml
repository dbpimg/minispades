name: MiniSpades smoke and syntax
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
      - run: node tests/match-flow.cjs
      - run: node tests/ai-strategy.cjs
      - run: node tests/bidding.cjs
      - run: node tests/joker-rules.cjs
      - run: node tests/scoring.cjs
